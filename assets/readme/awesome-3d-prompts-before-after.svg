<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Awesome 3D Prompts README before and after</title>
  <desc id="desc">A factual comparison of two public commits: an 80-line text-first catalog with 29 accepted cases becomes a visual gallery with 306 source-backed cases, a hero, workflow navigation, media previews, fidelity labels, and attribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12394f"/>
      <stop offset="1" stop-color="#182856"/>
    </linearGradient>
    <linearGradient id="proof" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .label { font-size: 16px; font-weight: 800; letter-spacing: 1.8px; }
    .h { font-size: 29px; font-weight: 780; }
    .metric { font-size: 20px; font-weight: 760; }
    .body { font-size: 16px; font-weight: 560; }
    .tiny { font-size: 14px; font-weight: 650; }
  </style>
  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="26" fill="url(#grid)"/>

  <text x="54" y="54" fill="#dbeafe" class="sans label">REAL REPOSITORY HISTORY · FIXED PUBLIC COMMITS</text>
  <text x="54" y="91" fill="#ffffff" class="sans h">Awesome GPT-6 Astra 3D Prompts</text>

  <g transform="translate(54 122)">
    <rect width="496" height="334" rx="20" fill="#111827" stroke="#64748b" stroke-opacity=".5"/>
    <text x="28" y="40" fill="#94a3b8" class="mono label">BEFORE · a591c0f</text>
    <text x="28" y="78" fill="#f8fafc" class="sans metric">29 accepted cases · 80 README lines</text>
    <text x="28" y="108" fill="#94a3b8" class="sans body">Text-first catalog</text>
    <rect x="28" y="138" width="440" height="42" rx="8" fill="#1f2937"/>
    <text x="44" y="164" fill="#cbd5e1" class="mono tiny">Effect   Engine   Prompt   Source</text>
    <g fill="#334155">
      <rect x="28" y="191" width="440" height="1"/>
      <rect x="28" y="231" width="440" height="1"/>
      <rect x="28" y="271" width="440" height="1"/>
    </g>
    <g fill="#64748b">
      <rect x="44" y="207" width="184" height="9" rx="4"/>
      <rect x="278" y="207" width="70" height="9" rx="4"/>
      <rect x="382" y="207" width="64" height="9" rx="4"/>
      <rect x="44" y="247" width="224" height="9" rx="4"/>
      <rect x="288" y="247" width="60" height="9" rx="4"/>
      <rect x="382" y="247" width="64" height="9" rx="4"/>
    </g>
    <text x="28" y="312" fill="#94a3b8" class="sans body">No hero · no result previews in the README</text>
  </g>

  <g transform="translate(650 122)">
    <rect width="496" height="334" rx="20" fill="url(#after)" stroke="#5eead4" stroke-opacity=".55"/>
    <text x="28" y="40" fill="#5eead4" class="mono label">AFTER · ac37217</text>
    <text x="28" y="78" fill="#ffffff" class="sans metric">306 source-backed cases · visual gallery</text>
    <rect x="28" y="106" width="440" height="82" rx="12" fill="#091526" stroke="#60a5fa" stroke-opacity=".5"/>
    <path d="M44 166L102 125l46 31 54-28 58 36 62-45 72 47z" fill="url(#proof)" fill-opacity=".8"/>
    <circle cx="411" cy="132" r="12" fill="#5eead4"/>
    <g transform="translate(28 206)">
      <rect width="138" height="78" rx="10" fill="#0b172a" stroke="#5eead4" stroke-opacity=".36"/>
      <rect x="151" width="138" height="78" rx="10" fill="#0b172a" stroke="#60a5fa" stroke-opacity=".36"/>
      <rect x="302" width="138" height="78" rx="10" fill="#0b172a" stroke="#a78bfa" stroke-opacity=".36"/>
      <text x="14" y="29" fill="#5eead4" class="mono tiny">250 WebM</text>
      <text x="165" y="29" fill="#60a5fa" class="mono tiny">56 WebP</text>
      <text x="316" y="29" fill="#c4b5fd" class="mono tiny">6 workflows</text>
      <text x="14" y="54" fill="#94a3b8" class="sans tiny">result media</text>
      <text x="165" y="54" fill="#94a3b8" class="sans tiny">result images</text>
      <text x="316" y="54" fill="#94a3b8" class="sans tiny">fast navigation</text>
    </g>
    <text x="28" y="314" fill="#dbeafe" class="sans body">Hero · previews · fidelity labels · attribution</text>
  </g>

  <path d="M574 288H626" stroke="url(#proof)" stroke-width="4" stroke-linecap="round"/>
  <path d="M616 278l12 10-12 10" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="486" text-anchor="middle" fill="#94a3b8" class="mono tiny">Same repository · exact commits linked below · no invented product claims</text>
</svg>
