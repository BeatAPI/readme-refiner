<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">README Studio</title>
  <desc id="desc">Beautiful, truthful, GitHub-safe README homepages</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7d8590" stroke-opacity=".13"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#0b0f14"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <text x="72" y="68" fill="#2dd4bf" font-family="monospace" font-size="17" font-weight="700" letter-spacing="2">BEATAPI · OPEN SOURCE AGENT SKILL</text>
  <text x="70" y="180" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-4">README</text>
  <text x="70" y="252" fill="#7d8590" font-family="Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-4">STUDIO</text>
  <text x="75" y="304" fill="#9da7b3" font-family="Arial, sans-serif" font-size="22">Beautiful · truthful · GitHub-safe</text>
  <rect x="72" y="336" width="230" height="36" rx="18" fill="#2dd4bf"/>
  <text x="187" y="359" text-anchor="middle" fill="#0b0f14" font-family="monospace" font-size="14" font-weight="800">COVER → PROOF → CHECK</text>
  <g transform="translate(704 62)">
    <rect width="420" height="276" rx="20" fill="#111820" stroke="#7d8590" stroke-opacity=".55"/>
    <circle cx="28" cy="27" r="5" fill="#ff6b6b"/><circle cx="46" cy="27" r="5" fill="#ffd166"/><circle cx="64" cy="27" r="5" fill="#2dd4bf"/>
    <path d="M22 54H398" stroke="#7d8590" stroke-opacity=".32"/>
    <text x="24" y="86" fill="#2dd4bf" font-family="monospace" font-size="15" font-weight="700">$ beautify-readme .</text>
    <g transform="translate(24 112)">
      <rect width="108" height="42" rx="8" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf"/>
      <text x="54" y="27" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="12">TRUTH</text>
      <path d="M116 21H148" stroke="url(#line)" stroke-width="3"/>
      <rect x="156" width="108" height="42" rx="8" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa"/>
      <text x="210" y="27" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12">DESIGN</text>
      <path d="M272 21H304" stroke="url(#line)" stroke-width="3"/>
      <rect x="312" width="60" height="42" rx="8" fill="#f0f6fc" fill-opacity=".08" stroke="#9da7b3"/>
      <text x="342" y="27" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="12">DIFF</text>
    </g>
    <text x="24" y="198" fill="#7d8590" font-family="monospace" font-size="13">✓ exact SVG cover</text>
    <text x="24" y="224" fill="#7d8590" font-family="monospace" font-size="13">✓ real repository proof</text>
    <text x="24" y="250" fill="#7d8590" font-family="monospace" font-size="13">✓ facts, links, commands</text>
    <circle cx="384" cy="237" r="14" fill="#2dd4bf"/><path d="M377 237l5 5 10-12" fill="none" stroke="#0b0f14" stroke-width="4"/>
  </g>
</svg>
